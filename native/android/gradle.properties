# Engine library build (WP-16). JAVA_HOME = JDK 21 (scripts/env.sh).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Jetpack Core-Telecom self-managed call strategy (DESIGN §10.2.2). Off by default: when
# true the build compiles src/telecom/kotlin and merges src/telecom/AndroidManifest.xml
# (MANAGE_OWN_CALLS, FOREGROUND_SERVICE_PHONE_CALL, phoneCall FGS type).
meshengine.telecom=false
