# pnpm workspace (owned by WP-01, DESIGN §2.1). pnpm only; Capacitor CLI via `pnpm exec cap`.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Supply-chain guard (convLink style): only install versions published at least one
# day ago. Add an exact `name@version` to minimumReleaseAgeExclude only for a reviewed
# urgent fix.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# Security floors carried over from convLink (transitive dependencies of Vite,
# Capacitor CLI, ESLint and Playwright).
overrides:
  '@xmldom/xmldom@<0.8.13': '>=0.8.13'
  '@xmldom/xmldom@>=0.9.0 <0.9.12': '^0.9.12'
  ajv@<6.14.0: '>=6.14.0'
  brace-expansion@<1.1.18: '^1.1.18'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
  brace-expansion@>=5.0.0 <5.0.9: '^5.0.9'
  browserslist@>=4.0.0 <4.28.7: '^4.28.7'
  flatted@<=3.4.1: '>=3.4.2'
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  nanoid@>=3.0.0 <3.3.18: '^3.3.18'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss@>=8.0.0 <8.5.23: '^8.5.23'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  tar@>=7.0.0 <7.5.21: '^7.5.21'
  undici@>=7.0.0 <7.29.0: '^7.29.0'
  vite@>=7.0.0 <=7.3.1: '>=7.3.2'
