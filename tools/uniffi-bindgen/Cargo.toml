# Workspace-local uniffi-bindgen (owned by WP-01, DESIGN §2.1, §2.3, D11): no global
# install. Used by `cargo xtask gen-bindings` as
# `cargo run -p uniffi-bindgen -- generate --library <libmesh_ffi.dylib> --config uniffi.toml ...`.
[package]
name = "uniffi-bindgen"
description = "UniFFI bindings generator pinned to the workspace uniffi version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
