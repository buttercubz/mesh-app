// convLink Voice app module (WP-18, DESIGN §2.4, §10.2.4). The app-local MeshIntercom
// bridge lives in src/main/java/com/convlink/voice/plugin (WP-19) and is registered by
// MainActivity before super.onCreate.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'com.convlink.voice'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.convlink.voice'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        // Phones only: arm64 devices and the x86_64 emulator (no armeabi-v7a, Play 64-bit).
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    androidResources {
        // Copied web assets: skip VCS and editor files, keep Vite's dot-free output.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    buildTypes {
        release {
            // R8 keep rules for JNA and the generated bindings ship with :meshengine.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig true
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Engine library from the included build native/android (substituted in settings.gradle).
    implementation 'com.convlink.voice:meshengine:0.1.0'
    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'
